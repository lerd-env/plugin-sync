api_version: 1
name: remote-pull
lerd: ">=1.37"
version: 0.2.0
description: Pull a site's database and uploaded files from its servers over SSH, or push them back, with an environment per server
docs: DOCS.md
icon: icon.svg
screenshots: [docs/tab.png]

# lerd remote-pull:setup | pull | push
commands:
  - name: setup
    usage: "Save one of the site's servers, or list them with no options: setup [--env production] --ssh user@host --path /remote/project [--url https://example.com] [--files a,b] [--sanitize file.sql] [--database --db-user --db-password] | --env name --remove"
    run: bin/setup
  - name: pull
    usage: "Pull the database and files from one of the site's servers: pull [site] [--env name] [--db-only | --files-only]"
    run: bin/pull
  - name: push
    usage: "Send the listed folders to a server, and with --db replace its database after a backup: push [site] --env name [--files] [--db] [--dry-run] [--yes]"
    run: bin/push

site_commands:
  - name: pull
    label: Pull from server
    description: Replace this site's database with a fresh copy from its server, after a snapshot, and sync its uploaded files
    confirm: true
    run: bin/pull

mcp:
  skill: SKILL.md
  tools:
    - name: pull
      description: Replace a lerd site's local database with a fresh dump from its production or staging server over SSH, after a before-remote-pull snapshot, then sync its configured upload folders. The server is set once by the user with lerd remote-pull:setup
      input_schema:
        type: object
        required: [site]
        properties:
          site: {type: string, description: lerd site name}
          what: {type: string, enum: [both, db, files], description: What to pull; both when omitted}
          env: {type: string, description: "Environment to pull from, like production or staging; needed only when the site has more than one"}
      run: bin/pull
      timeout: 10m

requires: [ssh, rsync]

api:
  - path: state
    methods: [GET]
    run: bin/api
  - path: ls
    methods: [GET]
    run: bin/api
    loopback_only: true
  - path: count
    methods: [GET]
    run: bin/api
    loopback_only: true
  - path: file
    methods: [GET]
    run: bin/api
    loopback_only: true
  - path: backups
    methods: [GET]
    run: bin/api
    loopback_only: true
  - path: env
    methods: [POST]
    run: bin/api
    loopback_only: true
  - path: run
    methods: [POST]
    run: bin/api
    loopback_only: true
    timeout: 10m

ui:
  site_tab: {title: Remote, entry: ui/site.html}
